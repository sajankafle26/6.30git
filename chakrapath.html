<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box;}
        ul{ margin: 50px; list-style: none; }
        li{ position: relative;  border-bottom: 1px solid #000; padding-bottom: 10px;}
        li::before{ content: ""; width: 2px; height: 100%; background: #000; position: absolute; left: -13px; top: 5px;}
       li::after{ content: ''; position: absolute; width:10px; height: 10px; border: 2px solid #000;
    top: 0px; left: -19px; border-radius: 50%; background: #fff;}
    li:first-child::after{ background: #000;}
    </style>
</head>
<body>
    <ul>
        <li> 
            ४३ मिनेट अगाडि | समाचार
            <h5>गण्डकी, बागमती र मधेश प्रदेशमा हल्कादेखि मध्यमसम्मको वर्षा</h5>
        </li>
    </ul>
</body>
</html>
