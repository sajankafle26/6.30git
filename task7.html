<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{ text-decoration: none; color: #000;}
        li{position: relative;}
        ul{ display: flex; list-style: none; gap: 50px;}
        li::after{ content: ''; position: absolute; left: 0; bottom: -4px; width: 100%; height: 2px; background: #000; transition: 0.9s; transform: scaleX(0);}
        li:hover::after{ transform: scaleX(1);}
    </style>
</head>

<body>
    <ul>
        <li><a href="">Success Gallery</a></li>
        <li><a href="">Student Testimonials</a></li>
    </ul>
</body>

</html>
