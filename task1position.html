<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box;}
        .box{ width: 300px; height: 300px; margin: 50px; position: relative; overflow: hidden;}
        .box img{ width: 100%; height: 100%; object-fit: cover;}
        .box h4{ background: #0000009e; color: #fff; padding: 10px; position: absolute; bottom: -35px; left: 0; width: 100%;
        transition: 0.4s;}
        .box:hover h4 { bottom: 0;}
    </style>
</head>
<body>
    <div class="box">
        <img src="./cow.webp" alt="">
        <h4>This is cow</h4>
    </div>
</body>
</html>
